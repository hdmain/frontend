# AlfaHost marketing site — Cloudflare orange-cloud proxy
# Cloudflare SSL/TLS mode: Full (CF connects to origin :443)

limit_req_zone $binary_remote_addr zone=alfahost_site_requests:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name alfahost.eu www.alfahost.eu;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    server_tokens off;
    root /var/www/alfahost.eu;
    index index.html;

    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_status 429;

    # Behind CF: do NOT blindly redirect HTTP→HTTPS (causes 301 loops on Flexible).
    # Only upgrade when the visitor hit origin HTTP directly (no CF https forward).
    set $redirect_https 0;
    if ($http_x_forwarded_proto = "http") {
        set $redirect_https 1;
    }
    if ($http_x_forwarded_proto = "") {
        set $redirect_https 1;
    }
    if ($redirect_https = 1) {
        return 301 https://$host$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        limit_req zone=alfahost_site_requests burst=60 nodelay;
        try_files $uri $uri/ $uri.html =404;
    }

    location = /pgp.txt {
        default_type text/plain;
        add_header Content-Disposition 'inline; filename="alfahost-pgp.txt"';
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alfahost.eu www.alfahost.eu;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    ssl_certificate     /etc/ssl/certs/alfahost.eu.crt;
    ssl_certificate_key /etc/ssl/private/alfahost.eu.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    root /var/www/alfahost.eu;
    index index.html;

    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req_status 429;

    location / {
        limit_req zone=alfahost_site_requests burst=60 nodelay;
        try_files $uri $uri/ $uri.html =404;
    }

    location = /pgp.txt {
        default_type text/plain;
        add_header Content-Disposition 'inline; filename="alfahost-pgp.txt"';
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
